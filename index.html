    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            padding: 1rem;
            box-sizing: border-box;
        }
        video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            z-index: 1;
            box-sizing: border-box;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #333; }
        input[type="email"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            font-size: 1rem;
        }
        input[type="email"]:focus {
            border-color: #5864A6;
            box-shadow: 0 0 0 2px rgba(88, 100, 166, 0.2);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #5864A6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.3s;
        }
        button:hover { background-color: #4a5594; }
        #linkArea {
            margin-top: 1.5rem;
            padding: 12px;
            background: #e9ecef;
            border-radius: 8px;
            word-break: break-all;
            display: none;
        }
        #linkArea a { color: #007bff; text-decoration: none; font-weight: bold; }
        #linkArea a:hover { text-decoration: underline; }
        .logo{
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 1.5rem 1rem;
            }
            h1 {
                font-size: 1.3rem;
            }
            .logo {
                width: 70px;
                height: 70px;
            }
        }
    </style>
